name: Dato incorrecto
description: Un número, un nombre o un resultado del sitio que no coincide con la realidad.
title: 'Dato incorrecto: '
labels: [dato, triage]
body:
  - type: input
    id: pagina
    attributes:
      label: Página
      description: La dirección de la página donde viste el dato.
      placeholder: https://pelotheta-basket-dva.vercel.app/...
    validations:
      required: true
  - type: input
    id: dato
    attributes:
      label: Qué dato está mal
      placeholder: Por ejemplo, puntos de un jugador en un partido
    validations:
      required: true
  - type: input
    id: esperado
    attributes:
      label: Valor esperado
    validations:
      required: true
  - type: input
    id: obtenido
    attributes:
      label: Valor que muestra el sitio
    validations:
      required: true
  - type: input
    id: fuente
    attributes:
      label: Dónde se ve el valor correcto
      description: Un enlace a la fuente (planilla de la Liga Nacional u otra).
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad (la confirma el triage)
      options:
        - Baja (cosmético o una estadística secundaria)
        - Media (una estadística o una página)
        - Alta (resultado, puntos o una métrica principal)
